name: Local workbench quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Browser journeys (local server, no provider)
        if: matrix.node == '24'
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROMIUM"
          npm run test:browser
